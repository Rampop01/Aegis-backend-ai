name: Aegis Backend Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    name: Backend PR Audit
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Review Backend Logic
        id: build_review
        continue-on-error: true
        run: |
          pip install -r requirements.txt
          pip install pytest
          if [ -d "tests" ] || find . -maxdepth 2 -name "test*.py" | grep -q .; then
            pytest
          else
            echo "No tests found. Skipping pytest."
          fi

      - name: ❌ Handle Review Failure
        if: steps.build_review.outcome == 'failure'
        run: |
          PR_TITLE=$(gh pr view ${{ github.event.pull_request.number }} --json title -q .title)
          gh pr comment ${{ github.event.pull_request.number }} --body "hey, took a look at the PR for '$PR_TITLE'. actually, it looks like the python tests are failing right now. mind checking the logs and fixing the errors? once it's passing, just push an update and we can get it merged."
          exit 1

      - name: ✅ Handle Review Success
        if: steps.build_review.outcome == 'success'
        run: |
          PR_TITLE=$(gh pr view ${{ github.event.pull_request.number }} --json title -q .title)
          gh pr comment ${{ github.event.pull_request.number }} --body "hey, just went through the changes for '$PR_TITLE'. python logic looks really solid and the tests passed perfectly. going ahead and merging this into main now, thanks for the contribution!"
          gh pr merge ${{ github.event.pull_request.number }} --merge --auto
